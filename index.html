      <h1>Headroom — Cognitive Load Assessment</h1>
      <p>
        Headroom is a cognitive load and burnout-risk platform. Take a short assessment to discover
        your Work Pattern archetype, then upload your calendar for a 90-day analysis of Core Load,
        Toxic Load, Growth Load and burnout-risk markers, with an AI coach that explains your results.
      </p>
      <h2>Core concepts</h2>
      <ul>
        <li><strong>Core Load</strong> — the intrinsic mental effort a task genuinely requires.</li>
        <li><strong>Toxic Load</strong> — avoidable overhead: context switching, interruptions, unclear process.</li>
        <li><strong>Growth Load</strong> — effort that builds durable skill and capability.</li>
        <li><strong>Burnout Risk</strong> — a deterministic score from calendar density, fragmentation, after-hours work and recovery gaps.</li>
      </ul>
